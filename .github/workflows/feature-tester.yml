name: FeatureTester CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build TerrainGeneration2D.slnx --configuration Release

      - name: Run tests
        run: dotnet test TerrainGeneration2D.Tests/TerrainGeneration2D.Tests.csproj --logger:trx --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: featuretester-results
          path: ./test-results

      - name: Emit metadata
        run: |
          echo "agent: FeatureTester" > ./test-results/metadata.txt
          echo "run-id: $GITHUB_RUN_ID" >> ./test-results/metadata.txt
          echo "results: success" >> ./test-results/metadata.txt
        if: always()
