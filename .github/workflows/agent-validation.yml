name: Agent Validation

on:
  pull_request:
    paths:
      - '**'

jobs:
  validate-agents:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run agent validation script
        run: |
          node .github/scripts/agent-validate.js

      - name: Validate agent edits
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {context, github} = require('@actions/github');
            const pr = context.payload.pull_request;
            if (!pr) throw new Error('No PR found');
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number});
            const files = changedFiles.map(f=>f.filename);

            const manifestsDir = path.join(process.cwd(), '.github', 'agents');
            const manifests = {};
            if (fs.existsSync(manifestsDir)){
              for (const mf of fs.readdirSync(manifestsDir)){
                if (!mf.endsWith('.md')) continue;
                const content = fs.readFileSync(path.join(manifestsDir, mf), 'utf8');
                const nameMatch = content.match(/name:\s*(.*)/);
                if (nameMatch) manifests[nameMatch[1].trim()] = content;
              }
            }

            function isUnderAny(p, prefixes){
              return prefixes.some(pref => p.startsWith(pref));
            }

            // Check commits for signed verification
            const commits = await github.rest.pulls.listCommits({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number});
            for (const c of commits.data) {
              if (!c.commit.verification || !c.commit.verification.verified) {
                const core = require('@actions/core');
                core.setFailed('All commits must be GPG/Signature verified. Commit ' + c.sha + ' is not verified.');
                return;
              }
            }

            // Validate changed files
            for (const f of files) {
              // Allow edits to agent manifests
              if (f.startsWith('.github/agents/')) continue;

              // If the file is a C# file, fail
              if (f.endsWith('.cs')) {
                const core = require('@actions/core');
                core.setFailed('C# source files must not be changed by agents: ' + f);
                return;
              }

              // If file is outside docs, fail
              if (!f.startsWith('docs/') && !f.startsWith('.github/')) {
                const core = require('@actions/core');
                core.setFailed('Agents may only modify files under docs/ or .github/: ' + f);
                return;
              }

              // If file is under docs, ensure agent frontmatter marker is present if content was added by an agent
              let content='';
              try { content = fs.readFileSync(f,'utf8'); } catch(e){}
              if (content && /agent:\s*(FeaturePlanner|ImplementationDocumenter|FeatureImplementer)/.test(content)){
                // ok - an agent claimed ownership
              }
            }

            console.log('Agent validation passed for PR #' + pr.number);
