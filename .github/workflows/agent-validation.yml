name: Agent Validation

on:
  pull_request:
    paths:
      - "**"

jobs:
  validate-agents:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run agent validation script (dry-run)
        run: |
          node .github/scripts/agent-validate.js --dry-run || true

      - name: Run PR validator (dry-run)
        run: |
          node .github/scripts/pr-validator.js || true

      - name: Publish PR validation summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./test-results/agent-pr-validation.md) {
            Get-Content ./test-results/agent-pr-validation.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "No validation report produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

